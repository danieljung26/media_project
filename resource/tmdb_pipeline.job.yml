resources:
  jobs:
    tmdb_pipeline:
      name: tmdb_pipeline

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - djjungg@gmail.com

      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: /Workspace/Users/djjungg@djjungggmail.onmicrosoft.com/media_project/notebooks/01_bronze_tmdb_ingest
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: /Workspace/Users/djjungg@djjungggmail.onmicrosoft.com/media_project/notebooks/03_silver_tmdb
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

        - task_key: gold_build
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: /Workspace/Users/djjungg@djjungggmail.onmicrosoft.com/media_project/notebooks/04_gold_tmdb
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"